[project]
name = "project"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3,<1.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "torch==2.5.1",
    "torchvision==0.20.1",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" },
]
